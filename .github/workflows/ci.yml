name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Полный локальный гейт качества: validate-docs, check-index --warn, lint, test, tsc,
      # vite build, check-bundle (см. package.json -> scripts.build, CLAUDE.md п.17).
      - name: Quality gate (lint, tests, tsc, vite build, check-bundle)
        run: npm run build

      - name: Package unpacked build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --dir

      - name: Patch exe icon (Windows)
        if: runner.os == 'Windows'
        run: node scripts/patch-exe-icon.mjs

      - name: Package unpacked build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --dir

      - name: Package unpacked build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --dir

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: projecthub-${{ runner.os }}
          path: release
          retention-days: 7
          if-no-files-found: error
